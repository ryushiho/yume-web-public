{% extends "base.html" %}

{% block title %}홈{% endblock %}
{% block header_title %}홈{% endblock %}

{% block content %}
<h1 style="margin-top:0;">홈</h1>

<div style="display:flex; gap:0.8rem; flex-wrap:wrap;">
  {% if is_admin %}
    <a class="btn" href="/dashboard/">관리 대시보드</a>
  {% elif is_member %}
    <a class="btn" href="/member/dashboard">내 대시보드</a>
  {% else %}
    <a class="btn" href="/member/login">로그인</a>
    <a class="btn" href="/auth/login">관리자 로그인</a>
  {% endif %}
</div>
{% endblock %}
